_subdirectory: template
_templates_suffix: .jinja
_min_copier_version: "9.0.0"
_tasks:
  - "python3 _post_init.py"

domain:
  type: str
  help: "Integration domain — used as the folder name under custom_components/ and the DOMAIN constant (e.g. 'smart_thermostat', 'solar_monitor')"
  validator: "{% if not domain | regex_search('^[a-z][a-z0-9_]*$') %}Must be lowercase letters, numbers, and underscores, starting with a letter{% endif %}"

integration_name:
  type: str
  help: "Human-readable name shown in the HA UI, README, and HACS listing (e.g. 'My Integration')"

description:
  type: str
  help: "Short description of the integration"
  default: "A custom Home Assistant integration"

github_user:
  type: str
  help: "GitHub username (for URLs and CODEOWNERS)"
  default: "eyalmichon"

git_name:
  type: str
  help: "Git author name for commits inside the devcontainer"

git_email:
  type: str
  help: "Git author email for commits inside the devcontainer"

iot_class:
  type: str
  help: "How the integration communicates with devices/services (https://www.home-assistant.io/blog/2016/02/12/classifying-the-internet-of-things/)"
  choices:
    "Local Polling - Communicates directly with the device, state is fetched at intervals": local_polling
    "Local Push - Communicates directly with the device, state is pushed on change": local_push
    "Cloud Polling - Communicates via cloud (requires internet), state is fetched at intervals": cloud_polling
    "Cloud Push - Communicates via cloud (requires internet), state is pushed on change": cloud_push
    "Calculated - Entity values are computed from other data, no external I/O": calculated
    "Assumed State - Cannot read device state, assumes based on last command sent": assumed_state
  default: local_polling

integration_type:
  type: str
  help: "The kind of integration this is, affects how HA treats config entries (https://developers.home-assistant.io/docs/creating_integration_manifest)"
  choices:
    "Hub - Connects to a gateway that manages multiple devices (e.g. Philips Hue, Z-Wave)": hub
    "Device - Represents a single device directly (e.g. ESPHome, a smart plug)": device
    "Service - Connects to a service/API, not a physical device (e.g. weather, DuckDNS)": service
  default: service

platforms:
  type: str
  help: |
    Comma-separated HA platforms to expose (https://developers.home-assistant.io/docs/core/entity).
    Available: sensor (readings), binary_sensor (on/off states), switch (toggleable controls),
    button (one-shot triggers), select (dropdown), number (numeric input), climate (HVAC/thermostat),
    light (brightness/color), cover (blinds/garage), fan, lock, media_player, camera
  default: "sensor"

has_config_flow:
  type: bool
  help: "Include a config flow? This is the UI-based setup wizard in Settings > Devices & Services. Almost always true for new integrations"
  default: true

python_version:
  type: str
  help: "Python version for the devcontainer and pyproject.toml — should match your target HA release (HA 2026.3+ requires 3.14+)"
  default: "3.14"

install_hacs:
  type: bool
  help: "Install HACS (Home Assistant Community Store) in the dev environment? Adds ~10s to first startup for downloading and installing its dependencies"
  default: false

dev_integrations:
  type: yaml
  help: |
    Optional extra HA integrations to enable in the dev configuration.yaml.
    The base config already includes all lightweight built-in integrations (automation, script,
    scene, input helpers, template, recorder, history, logbook, sun, etc.).
    These are heavier or specialized integrations you can opt into.
  multiselect: true
  default: []
  choices:
    "MQTT broker (local mosquitto)": mqtt
    "REST commands/sensors": rest
    "Mobile App support": mobile_app
    "Energy dashboard": energy
    "Media Source": media_source
